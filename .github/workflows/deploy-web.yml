name: Deploy Web Driver to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: native/ui/package-lock.json

      - name: Install UI dependencies
        run: npm --prefix native/ui ci --no-audit --no-fund

      - name: Run Web Driver golden vector & transaction tests
        run: npm --prefix native/ui run test:web

      - name: Build static Web Driver bundle
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm --prefix native/ui run build

      - name: Add .nojekyll marker
        run: touch native/ui/dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: native/ui/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
