name: Release Windows Desktop Edition

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: native/ui/package-lock.json

      - name: Setup stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native -> build/rust-target"

      - name: Run Web + Rust test suites & build desktop executable
        shell: pwsh
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            ./native/build.ps1 -ExpectedTag $env:GITHUB_REF_NAME
          } else {
            ./native/build.ps1
          }

      - name: Verify staged binary version & package OPlusStudio-Windows-x64.zip
        shell: pwsh
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          $cargoText = Get-Content -LiteralPath "native/Cargo.toml" -Raw
          if ($cargoText -notmatch '(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"') {
            throw "Unable to parse workspace version from native/Cargo.toml"
          }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag '$($env:GITHUB_REF_NAME)' does not match Cargo version 'v$version'"
          }
          $stage = "releases/$version/OPlusStudio"
          $exePath = "$stage/OPlusStudio.Native.exe"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Missing staged binary at $exePath"
          }
          $verInfo = (Get-Item -LiteralPath $exePath).VersionInfo
          if (-not $verInfo.ProductVersion.StartsWith($version) -or -not $verInfo.FileVersion.StartsWith($version)) {
            throw "Binary VersionInfo mismatch: Product='$($verInfo.ProductVersion)' File='$($verInfo.FileVersion)' Expected='$version'"
          }
          $zipPath = "OPlusStudio-Windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path `
            "$stage/OPlusStudio.Native.exe", `
            "$stage/LICENSE", `
            "$stage/NOTICE.md", `
            "$stage/README.md" `
            -DestinationPath $zipPath -Force

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPlusStudio-Windows-x64
          path: OPlusStudio-Windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OPlusStudio-Windows-x64.zip
          generate_release_notes: true
