name: Release Windows Desktop Edition

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: native/ui/package-lock.json

      - name: Setup stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "native -> build/rust-target"

      - name: Run Web + Rust test suites & build desktop executable
        shell: pwsh
        run: ./native/build.ps1

      - name: Package OPlusStudio-Windows-x64.zip
        shell: pwsh
        run: |
          $stage = "releases/0.6.0/OPlusStudio"
          $zipPath = "OPlusStudio-Windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path `
            "$stage/OPlusStudio.Native.exe", `
            "$stage/LICENSE", `
            "$stage/NOTICE.md", `
            "$stage/README.md" `
            -DestinationPath $zipPath -Force

      - name: Upload workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPlusStudio-Windows-x64
          path: OPlusStudio-Windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OPlusStudio-Windows-x64.zip
          generate_release_notes: true
