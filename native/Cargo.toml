[workspace]
members = ["crates/oplus-core", "crates/oplus-device", "app"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
hex = "0.4"
sha2 = "0.10"
async-trait = "0.1"

[profile.release]
lto = "thin"
strip = true
